name: Compilar FIFA CUP APK

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Preparar debug.keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Configurar Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Compilar APK de FIFA CUP
        run: gradle :app:assembleDebug --no-daemon

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: FIFA-CUP-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar FIFA-CUP.apk en Releases para descarga directa
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk FIFA-CUP.apk
          if gh release view v1.0-apk >/dev/null 2>&1; then
            gh release upload v1.0-apk FIFA-CUP.apk --clobber
          else
            gh release create v1.0-apk FIFA-CUP.apk \
              --title "FIFA CUP (APK)" \
              --notes "Toca FIFA-CUP.apk abajo para descargar e instalar en tu celular Android."
          fi
